services:
  mongo:
    image: mongo:7
    container_name: tiktok_mongo_prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27019:27019"
    volumes:
      - ./.docker/prod/mongo:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    container_name: tiktok_mongoexpress_prod
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27019/
    ports:
      - "8083:8083"
    depends_on:
      - mongo
    restart: unless-stopped