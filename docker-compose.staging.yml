services:
  db:
    image: postgres:17
    container_name: tiktok_pg_staging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiktok_live_staging
    ports:
      - "5433:5432"
    volumes:
      - ./.docker/staging/db:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tiktok_pgadmin_staging
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamil.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - db
    volumes:
      - ./.docker/staging/pgadmin:/var/lib/pgadmin