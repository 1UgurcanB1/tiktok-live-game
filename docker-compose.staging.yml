services:
  mongo:
    image: mongo:7
    container_name: tiktok_mongo_staging
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27018:27017"
    volumes:
      - ./.docker/staging/mongo:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    container_name: tiktok_mongoexpress_staging
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27018/
    ports:
      - "8082:8082"
    depends_on:
      - mongo
    restart: unless-stopped