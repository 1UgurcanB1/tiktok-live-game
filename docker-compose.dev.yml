services:
  db:
    image: postgres:17
    container_name: tiktok_pg_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiktok_live_dev
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/dev/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tiktok_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamil.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - ./.docker/dev/pgadmin:/var/lib/pgadmin